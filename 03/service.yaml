apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: lesson1
spec:
  type: ClusterIP
  selector:
    app: demo-web
  ports:
    - name: nginx-http
      protocol: TCP
      port: 80
      targetPort: 80

    - name: multitool-http
      protocol: TCP
      port: 8080
      targetPort: 8080
