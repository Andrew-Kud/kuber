apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-volume-demo

spec:
  replicas: 1
  selector:
    matchLabels:
      app: shared-volume-demo

  template:
    metadata:
      labels:
        app: shared-volume-demo

    spec:
      containers:
        - name: busybox
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                date -u '+%Y-%m-%dT%H:%M:%SZ' >> /shared/timestamps.log
                sleep 5
              done
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool:3.24.4
          volumeMounts:
            - name: shared-data
              mountPath: /shared
              readOnly: true

      volumes:
        - name: shared-data
          emptyDir:
            sizeLimit: 10Mi
