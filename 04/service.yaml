apiVersion: v1
kind: Service
metadata:
  name: app-service

spec:
  type: ClusterIP

  selector:
    app: web-app

  ports:
    - name: nginx
      protocol: TCP
      port: 9001
      targetPort: nginx-http

    - name: multitool
      protocol: TCP
      port: 9002
      targetPort: multitool-http
