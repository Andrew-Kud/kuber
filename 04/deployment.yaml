apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 3

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          ports:
            - name: nginx-http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: nginx-http

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

        - name: multitool
          image: wbitt/network-multitool:3.24.4

          env:
            - name: HTTP_PORT
              value: "8080"

          ports:
            - name: multitool-http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: multitool-http

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
