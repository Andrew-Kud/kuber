apiVersion: v1
kind: Pod
metadata:
  name: network-client
  labels:
    app: network-client

spec:
  containers:
    - name: multitool
      image: wbitt/network-multitool:3.24.4
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
