apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-demo-tls
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: public
  tls:
    - hosts:
        - myapp.example.com
      secretName: web-demo-tls
  rules:
    - host: myapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-demo-svc
                port:
                  number: 80